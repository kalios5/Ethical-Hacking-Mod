services:

  # ── nginx reverse proxy ───────────────────────────────────────────────────
  web:
    build:
      context:    ./deployment/nginx
      dockerfile: Dockerfile
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./app/static:/var/www/static/
    depends_on:
      - app
    networks:
      - application

  # ── Flask backend ─────────────────────────────────────────────────────────
  app:
    build:
      context:    .
      dockerfile: deployment/Dockerfile
    container_name: app
    restart: always
    expose:
      - "5000"
    environment:
      APP_CONFIG:  production
      SECRET_KEY:  ${SECRET_KEY}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     ${DB_NAME}
    volumes:
      - ./.env:/.env
      - ./logs:/logs
      - ./uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application

  # ── PostgreSQL database ───────────────────────────────────────────────────
  db:
    image: postgres:16          # postgres:18 does not exist — latest stable is 16/17
    container_name: postgres-db
    environment:
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data   # /data is required — postgres won't start without it
    networks:
      - application
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout:  5s
      retries:  5

# ── networks ──────────────────────────────────────────────────────────────────
networks:
  application:
    name: application

# ── volumes ───────────────────────────────────────────────────────────────────
volumes:
  pgdata: