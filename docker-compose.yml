services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./app/static:/var/www/static/
    depends_on:
      - app
    networks:
      - application

  db:
    image: postgres:18
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    environment:
      APP_CONFIG: production
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: app
    restart: always
    volumes:
      - ./.env:/.env
      - ./logs:/logs
      - ./uploads:/uploads
    networks:
      - application
    depends_on:
      db:
        condition: service_healthy

networks:
  application:
    name: application

volumes:
  pgdata: