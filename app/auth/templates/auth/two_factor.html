{% extends "base.html" %}
{% block title %}Two-factor authentication | Petal & Stem{% endblock %}
{% block content %}
    <section class="form-page">
        <p class="eyebrow">Security check</p>
        <h1>Enter your code</h1>
        <p class="muted">Open your authenticator app and enter the current 6-digit code.</p>
        <form class="form-card" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Authentication code
                <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" autofocus required>
            </label>
            <button class="button" type="submit">Verify</button>
        </form>
    </section>
{% endblock %}
