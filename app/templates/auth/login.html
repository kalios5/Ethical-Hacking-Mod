{% extends "base.html" %}
{% block title %}Log in | Petal & Stem{% endblock %}
{% block content %}
    <section class="form-page">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in</h1>
        <form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Username
                <input name="username" autocomplete="username" required>
            </label>
            <label>Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            {% if captcha_question %}
            <label>Security check: {{ captcha_question }}
                <input name="captcha_answer" inputmode="numeric" autocomplete="off" required>
            </label>
            <input type="hidden" name="captcha_token" value="{{ captcha_token }}">
            {% endif %}
            <button class="button" type="submit">Log in</button>
            <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
        </form>
    </section>
{% endblock %}
