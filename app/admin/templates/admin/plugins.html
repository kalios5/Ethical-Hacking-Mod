{% extends "base.html" %}{% block title %}Plugins | Admin{% endblock %}{% block content %}<div class="section-heading"><div><p class="eyebrow">Admin / Storefront</p><h1>Plugins</h1></div><a class="back" href="{{ url_for('admin.dashboard') }}">← Dashboard</a></div><form method="post"><div class="plugin-list">{% for plugin in plugins %}<label class="plugin-row"><input type="checkbox" name="active_plugins" value="{{ plugin.name }}"{% if plugin.enabled %} checked{% endif %}><span><strong>{{ plugin.display_name }}</strong><small>{{ plugin.description }}</small></span></label>{% endfor %}</div><button class="button" type="submit">Save plugin settings</button></form><p><a href="{{ url_for('admin.upload_plugin') }}">Upload a new plugin →</a></p>{% endblock %}
