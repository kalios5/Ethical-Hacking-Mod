{% extends "base.html" %}
{% block title %}Edit product | Admin{% endblock %}
{% block content %}
    <section class="form-page">
        <p class="eyebrow">Admin / Catalogue</p>
        <h1>Edit product</h1>
        <form class="form-card" method="post">
            <label>Name
                <input name="name" value="{{ product.name }}" required>
            </label>
            <label>Description
                <textarea name="description" rows="3">{{ product.description or '' }}</textarea>
            </label>
            <label>Price
                <input name="price" type="number" min="0" step="0.01" value="{{ '%.2f'|format(product.price) }}" required>
            </label>
            <label>Stock
                <input name="stock" type="number" min="0" value="{{ product.stock }}" required>
            </label>
            <button class="button" type="submit">Save product</button>
            <a class="back" href="{{ url_for('admin.products') }}">Cancel</a>
        </form>
    </section>
{% endblock %}
