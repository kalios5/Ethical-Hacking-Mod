<h1>Manage Plugins</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% for p in plugins %}
        <label>
            <input type="checkbox" name="active_plugins" value="{{ p.name }}"
                   {% if p.enabled %}checked{% endif %}>
            <strong>{{ p.display_name }}</strong> — {{ p.description }}
        </label><br>
    {% endfor %}
    <button type="submit">Save</button>
</form>
<a href="{{ url_for('pluginmanager.storefront_preview') }}">Preview storefront →</a>
