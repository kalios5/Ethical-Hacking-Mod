---
# =============================================================================
# setup.yml
# Ansible playbook — EC2 Ubuntu host setup and hardening
# for the SaaS e-commerce vulnerable lab.
#
# Usage:
#   ansible-playbook -i inventory.ini setup.yml -e @vars.yml
#   ansible-playbook -i inventory.ini setup.yml -e @vars.yml --ask-become-pass
# =============================================================================

- name: Lab host setup and hardening
  hosts: lab_host
  become: true
  vars_files:
    - vars.yml

  tasks:

    # ── 1. system update ──────────────────────────────────────────────────────

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    # ── 2. create admin user ──────────────────────────────────────────────────

    - name: Create admin user account
      user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes
        state: present

    - name: Add SSH public key for admin user
      authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_ssh_public_key }}"
        state: present

    - name: Set correct permissions on admin .ssh directory
      file:
        path: "/home/{{ admin_user }}/.ssh"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"
        state: directory

    # ── 3. SSH hardening ──────────────────────────────────────────────────────

    - name: Create SSH login banner
      copy:
        dest: /etc/issue.net
        content: "{{ ssh_banner_text }}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Write SSH hardening config
      copy:
        dest: /etc/ssh/sshd_config.d/lab-hardening.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          # Lab hardening — generated by Ansible
          PermitRootLogin no
          # Both users allowed:
          #   ec2_user  ({{ ec2_user }})   — original PEM key access, used by Ansible
          #   admin_user ({{ admin_user }}) — hardened admin account
          AllowUsers {{ ec2_user }} {{ admin_user }}
          MaxAuthTries {{ ssh_max_auth_tries }}
          MaxSessions {{ ssh_max_sessions }}
          ClientAliveInterval {{ ssh_client_alive_interval }}
          ClientAliveCountMax {{ ssh_client_alive_count_max }}
          X11Forwarding no
          AllowTcpForwarding no
          AllowAgentForwarding no
          LogLevel {{ ssh_log_level }}
          Banner /etc/issue.net

    - name: Validate SSH config before restarting
      command: sshd -t
      changed_when: false

    - name: Restart SSH daemon
      service:
        name: ssh      # Ubuntu uses 'ssh' not 'sshd' (CentOS/RHEL use 'sshd')
        state: restarted
        enabled: yes

    # ── 4. firewall (UFW) ─────────────────────────────────────────────────────

    - name: Install UFW
      apt:
        name: ufw
        state: present

    - name: Allow SSH before enabling firewall
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Set default incoming policy to deny
      ufw:
        default: deny
        direction: incoming

    - name: Set default outgoing policy to allow
      ufw:
        default: allow
        direction: outgoing

    - name: Enable UFW
      ufw:
        state: enabled

    # ── 5. fail2ban ───────────────────────────────────────────────────────────

    - name: Install fail2ban
      apt:
        name: fail2ban
        state: present

    - name: Write fail2ban SSH jail config
      copy:
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled  = true
          maxretry = {{ fail2ban_maxretry }}
          findtime = {{ fail2ban_findtime }}
          bantime  = {{ fail2ban_bantime }}
          port     = 22
          logpath  = /var/log/auth.log

    - name: Enable and start fail2ban
      service:
        name: fail2ban
        state: started
        enabled: yes

    # ── 6. sudo hardening ─────────────────────────────────────────────────────

    - name: Write sudo hardening config
      copy:
        dest: /etc/sudoers.d/lab-hardening
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
        content: |
          # Lab sudo hardening — generated by Ansible
          Defaults logfile=/var/log/sudo.log
          Defaults requiretty
          Defaults timestamp_timeout={{ sudo_timestamp_timeout }}
          Defaults passwd_tries={{ sudo_passwd_tries }}
          Defaults log_input,log_output

    - name: Create sudo IO log directory
      file:
        path: /var/log/sudo-io
        owner: root
        group: root
        mode: "0700"
        state: directory

    # ── 7. default umask ──────────────────────────────────────────────────────

    - name: Set system-wide umask to 027
      copy:
        dest: /etc/profile.d/lab-umask.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          # Lab hardening — restrict default file permissions
          umask 027

    - name: Set umask in root bashrc
      lineinfile:
        path: /root/.bashrc
        line: "umask 027"
        state: present

    - name: Set umask in admin user bashrc
      lineinfile:
        path: "/home/{{ admin_user }}/.bashrc"
        line: "umask 027"
        state: present

    # ── 8. prepare /root/.ssh for CopyEscape write target ─────────────────────

    - name: Ensure /root/.ssh exists
      file:
        path: /root/.ssh
        owner: root
        group: root
        mode: "0700"
        state: directory

    - name: Ensure authorized_keys exists
      file:
        path: /root/.ssh/authorized_keys
        owner: root
        group: root
        mode: "0600"
        state: touch
        modification_time: preserve
        access_time: preserve

    # ── 9. install Docker Engine pinned to 29.6.1 ─────────────────────────────

    - name: Install Docker dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        mode: "0755"
        state: directory

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) \
          signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(lsb_release -cs) stable" \
          | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Install Docker Engine pinned to 29.6.1
      apt:
        name:
          - "docker-ce=5:29.6.1-1~ubuntu.{{ ansible_facts['distribution_version'] }}~{{ ansible_facts['distribution_release'] }}"
          - "docker-ce-cli=5:29.6.1-1~ubuntu.{{ ansible_facts['distribution_version'] }}~{{ ansible_facts['distribution_release'] }}"
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Pin Docker version — prevent upgrade patching the CVE
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io

    - name: Ensure Docker is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    # ── 10. host script directories ───────────────────────────────────────────

    - name: Create platform log directory
      file:
        path: "{{ collector_log_dir }}"
        owner: root
        group: root
        mode: "0755"
        state: directory

    - name: Create collector log file
      file:
        path: "{{ collector_log }}"
        owner: root
        group: root
        mode: "0644"
        state: touch
        modification_time: preserve
        access_time: preserve

    # ── 11. install collect_logs.sh ───────────────────────────────────────────

    - name: Copy collect_logs.sh to host
      copy:
        src: "{{ collector_script_src }}"
        dest: "{{ collector_script_dest }}"
        owner: root
        group: root
        mode: "0755"

    - name: Write host cron entry for log collection
      copy:
        dest: /etc/cron.d/platform_log_collector
        owner: root
        group: root
        mode: "0644"
        content: |
          # Platform log collection — CopyEscape trigger
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

          */2 * * * * root CONTAINER_NAME={{ container_name }} {{ collector_script_dest }} >> {{ collector_log }} 2>&1

    - name: Restart cron to pick up new entry
      service:
        name: cron
        state: restarted    # Ubuntu's cron does not support reload — use restart

    # ── 12. verification ──────────────────────────────────────────────────────

    - name: Verify Docker version is 29.6.1
      command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
      register: docker_ver
      changed_when: false
      failed_when: "'29.6.1' not in docker_ver.stdout"

    - name: Verify UFW is active
      command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: "'active' not in ufw_status.stdout"

    - name: Verify fail2ban is running
      command: fail2ban-client status sshd
      register: f2b_status
      changed_when: false
      failed_when: f2b_status.rc != 0

    - name: Verify SSH config is valid
      command: sshd -t
      changed_when: false

    - name: Verify collector script is executable
      stat:
        path: "{{ collector_script_dest }}"
      register: collector_stat
      failed_when: not collector_stat.stat.executable

    - name: Verify /root/.ssh/authorized_keys exists
      stat:
        path: /root/.ssh/authorized_keys
      register: authkeys_stat
      failed_when: not authkeys_stat.stat.exists

    - name: Print verification summary
      debug:
        msg:
          - "Docker version : {{ docker_ver.stdout }}"
          - "UFW status     : active"
          - "fail2ban       : running"
          - "SSH config     : valid"
          - "Collector      : executable at {{ collector_script_dest }}"
          - "authorized_keys: present at /root/.ssh/authorized_keys"
          - "Host is ready — cloning repo and deploying"

    # ── 13. clone repo and deploy ─────────────────────────────────────────────

    - name: Clone the project repository
      git:
        repo: https://github.com/kalios5/Ethical-Hacking-Mod.git
        dest: /home/{{ admin_user }}/Ethical-Hacking-Mod
        update: yes
        force: yes

    - name: Set execute permission on CronScript.sh
      file:
        path: /home/{{ admin_user }}/Ethical-Hacking-Mod/Scripts/DockerEscapeScripts/HostScripts/CronScript.sh
        mode: "0755"
        owner: root
        group: root

    - name: Write cron entry for log collection
      cron:
        name: "platform log collector"
        user: root
        minute: "*"
        hour: "*"
        day: "*"
        month: "*"
        weekday: "*"
        job: >-
          CONTAINER_NAME=app
          /home/{{ admin_user }}/Ethical-Hacking-Mod/Scripts/DockerEscapeScripts/HostScripts/CronScript.sh
          >> /var/log/app.log 2>&1
        state: present

    - name: Rename .env.example to .env for docker compose
      command:
        cmd: mv .env.example .env
        chdir: /home/{{ admin_user }}/Ethical-Hacking-Mod
      args:
        creates: /home/{{ admin_user }}/Ethical-Hacking-Mod/.env  # skip if .env already exists

    - name: Build and start Docker containers
      community.docker.docker_compose_v2:
        project_src: /home/{{ admin_user }}/Ethical-Hacking-Mod
        build: always
        state: present
      register: compose_result

    - name: Confirm containers are running
      community.docker.docker_container_info:
        name: app
      register: app_container
      failed_when: not app_container.exists or app_container.container.State.Status != 'running'

    - name: Print deployment summary
      debug:
        msg:
          - "Repo cloned to : /home/{{ admin_user }}/Ethical-Hacking-Mod"
          - "CronScript     : executable"
          - "Cron entry     : planted"
          - "Containers     : running"
          - "Site available : https://{{ inventory_hostname }}"