# =============================================================================
# docker-compose.mysql.yml
# -----------------------------------------------------------------------------
# Full stack using MySQL (per the tech-stack diagram) instead of the Postgres
# service in the original docker-compose.yml.
#
# The DB-container member owns the `db` service below. The `app` and `nginx`
# services are owned by other members - they are included here so the whole
# thing runs end to end, but coordinate before changing them.
#
# Run from the deployment/ folder:
#     docker compose -f docker-compose.mysql.yml --env-file .env up -d --build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DATABASE CONTAINER  (my part)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    # The my.cnf we mount into /etc/mysql/conf.d is picked up automatically -
    # no custom command needed.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USERNAME}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    # Only expose the port on the internal docker network, NOT to the host.
    # (Use `ports:` instead of `expose:` only if you need to reach MySQL from
    #  your laptop with a client for debugging - remove before the freeze.)
    expose:
      - "3306"
    volumes:
      # Persistent data - survives container restarts.
      - mysql_data:/var/lib/mysql
      # Server config (logging, networking, charset).
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # Init scripts: MySQL runs every *.sql / *.sh here IN ALPHABETICAL ORDER
      # the FIRST time the data volume is empty. This is how the schema + seed
      # get created automatically.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Bind-mount the server logs to the host so we (and the Docker-Escape PoC)
      # have a real logs folder to read with `docker cp` / on disk.
      - ./db/logs:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - application

  # ---------------------------------------------------------------------------
  # APPLICATION CONTAINER  (owned by app members - shown for completeness)
  # ---------------------------------------------------------------------------
  app:
    build: .
    image: eh-mod:latest
    container_name: flask-app
    restart: always
    env_file:
      - .env
    # Bind-mount the app log folder to the host too (same reason as DB logs).
    volumes:
      - ./logs:/app/logs
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application

  # ---------------------------------------------------------------------------
  # REVERSE PROXY  (owned by infra member - shown for completeness)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - application

networks:
  application:
    name: application

volumes:
  mysql_data:
