services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./app/static:/var/www/static
    depends_on:
      - app
    networks:
      - application

  db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB : ${DB_NAME}
    ports:
      - ${DB_PORT}:${DB_PORT}
    expose:
      - ${DB_PORT}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - application

  app:
    build: .
    image: EH-Mod:latest
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./.env:/.env
    networks:
      - application
    depends_on:
      - db

networks:
  application:
    name: application

volumes:
  pgdata:


