events {}

http {
    server {
        listen 80;
        server_name _;

        location /static/ {
            alias /static/;
            expires 30d;
            access_log off;
        }
        location / {
            proxy_pass http://app:5000;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


    }
}